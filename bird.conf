include "bird.local.conf";
include "bird.pool.conf";

log syslog all;

router id public_ipv4;

protocol device {
    scan time 10;
}

filter grapheneos_filter {
    local_filter();

    if pool = "ns1" then {
        # Cogent: set localpref to 70 (below peers)
        bgp_community.add((174, 70));
    }
    if node != "ber.ns2" then {
        if pop != "ams" && pop != "fra" && pop != "lon" && pop != "mad" then {
            # Cogent: set localpref to 10 upon entering AF
            bgp_community.add((174, 932));
        }
        if cn != "oc" && node != "sin.ns2" && node != "tyo.ns2" then {
            # Cogent: set localpref to 10 upon entering AU
            bgp_community.add((174, 942));
        }
        if cn != "sa" && pop != "mia" then {
            # Cogent: set localpref to 10 upon entering SA
            bgp_community.add((174, 952));
        }
        if cn != "as" then {
            # Cogent: set localpref to 10 upon entering AP
            bgp_community.add((174, 962));
        }
        if cn != "na" then {
            # Cogent: set localpref to 10 upon entering NA
            bgp_community.add((174, 972));
        }
        if cn != "eu" then {
            # Cogent: set localpref to 10 upon entering EU
            bgp_community.add((174, 982));
        }
    }

    # Arelion: set localpref to 50 beyond the connected region
    bgp_community.add((1299, 10050));
    if cn != "eu" then {
        # Arelion: prepend 2x to all peers in Europe
        bgp_community.add((1299, 2002));
    }
    if cn != "na" then {
        # Arelion: prepend 2x to all peers in North America
        bgp_community.add((1299, 5002));
    }
    if cn != "as" then {
        # Arelion: prepend 2x to all peers in Asia & Pacific
        bgp_community.add((1299, 7002));
    }
    # Arelion: prepend 2x to China Unicom in Europe and North America
    bgp_community.add((1299, 2872));
    bgp_community.add((1299, 5872));
    # Arelion: prepend 2x to China Telecom in Europe and North America
    bgp_community.add((1299, 2882));
    bgp_community.add((1299, 5882));

    if node != "ber.ns2" && node != "yto.ns2" then {
        if pool = "ns2" && cn = "na" then {
            # NTT: set localpref to 96 (customer fallback)
            bgp_community.add((2914, 450));
        }
        if pop != "mia" then {
            # NTT: set localpref to 50 beyond the connected region
            bgp_community.add((2914, 436));
        } else {
            # NTT: set localpref to 50 within EU
            bgp_community.add((65530, 3200));
            # NTT: set localpref to 50 within AS
            bgp_community.add((65530, 3400));
        }
        if pool = "ns1" && cn = "eu" && pop != "mad" then {
            # NTT: set localpref to 50 in Spain
            bgp_community.add((65520, 2205));
        }
        if cn != "na" then {
            # NTT: prepend 2x to all customers in North America
            bgp_community.add((2914, 4012));
            # NTT: prepend 2x to all peers in North America
            bgp_community.add((2914, 4022));
        }
        if cn != "eu" then {
            # NTT: prepend 2x to all customers in Europe
            bgp_community.add((2914, 4212));
            # NTT: prepend 2x to all peers in Europe
            bgp_community.add((2914, 4222));
        }
        if cn != "as" && cn != "oc" then {
            # NTT: prepend 2x to all customers in Asia
            bgp_community.add((2914, 4412));
            # NTT: prepend 2x to all peers in Asia
            bgp_community.add((2914, 4422));
        }
        if cn != "sa" && pop != "mia" then {
            # NTT: prepend 2x to all customers in South America
            bgp_community.add((2914, 4612));
            # NTT: prepend 2x to all peers in South America
            bgp_community.add((2914, 4622));
        }
        if pop != "fra" then {
            # NTT: do not advertise to Swisscom
            bgp_community.add((65500, 3303));
        }
    }

    if node != "ber.ns2" then {
        # GTT: set localpref way below peers in configured regions
        bgp_community.add((3257, 1960));
        if cn != "eu" then {
            # GTT: set localpref in Europe
            bgp_community.add((3257, 2010));
            # GTT: prepend 2x in Europe
            bgp_community.add((3257, 2492));
        }
        if pop != "ams" && pop != "fra" && pop != "lon" && pop != "mad" then {
            # GTT: set localpref in Africa
            bgp_community.add((3257, 2012));
            # GTT: prepend 2x in Africa
            bgp_community.add((3257, 2692));
        }
        if cn != "as" && cn != "oc" then {
            # GTT: set localpref in Asia
            bgp_community.add((3257, 2011));
            # GTT: prepend 2x in Asia
            bgp_community.add((3257, 2592));
        }
        if cn != "sa" && pop != "mia" then {
            # GTT: set localpref in South America
            bgp_community.add((3257, 2013));
            # GTT: prepend 2x in South America
            bgp_community.add((3257, 2892));
        }
        if cn != "na" then {
            # GTT: set localpref in North America
            bgp_community.add((3257, 2014));
            # GTT: prepend 2x in North America
            bgp_community.add((3257, 2992));
        }
    }

    if node != "yto.ns2" then {
        # Lumen: set localpref to 70 (below peers)
        bgp_community.add((3356, 70));
    }

    if node != "ber.ns2" && node != "yto.ns2" then {
        if cn = "eu" || (pool = "ns2" && cn = "na") then {
            # PCCW: set localpref to 70
            bgp_community.add((3491, 51011));
        }
        if pop != "ams" && pop != "fra" && pop != "lon" && pop != "mad" && node != "sin.ns2" && node != "tyo.ns2" then {
            # PCCW: set localpref to 60 beyond the connected region
            bgp_community.add((3491, 51912));
        } else {
            # PCCW: set localpref to 60 in North America
            bgp_community.add((3491, 51112));
        }
        if pop = "ams" || pop = "fra" || pop = "lon" || pop = "mad" then {
            # PCCW: set localpref to 60 in Asia
            bgp_community.add((3491, 51412));
            # PCCW: set localpref to 60 in Australia
            bgp_community.add((3491, 51712));
        }
        if node = "sin.ns2" || node = "tyo.ns2" then {
            # PCCW: set localpref to 60 in Europe
            bgp_community.add((3491, 51312));
            # PCCW: set localpref to 60 in Africa
            bgp_community.add((3491, 51512));
        }
        if cn != "na" then {
            # PCCW: prepend 2x to all peers in North America
            bgp_community.add((3491, 50102));
        }
        if cn != "eu" then {
            # PCCW: prepend 2x to all peers in Europe
            bgp_community.add((3491, 50302));
        }
        if cn != "as" then {
            # PCCW: prepend 2x to all peers in Asia
            bgp_community.add((3491, 50402));
        }
        if pop != "ams" && pop != "fra" && pop != "lon" && pop != "mad" then {
            # PCCW: prepend 2x to all peers in Africa
            bgp_community.add((3491, 50502));
        }
        if cn != "oc" && node != "sin.ns2" && node != "tyo.ns2" then {
            # PCCW: prepend 2x to all peers in Australia
            bgp_community.add((3491, 50702));
        }
    }

    if pool = "ns2" && pop != "ber" && pop != "yto" then {
        # TATA: prepend 1x to peers in North America
        bgp_community.add((65101, 1000));
        # TATA: prepend 1x to peers in Europe
        bgp_community.add((65101, 2000));
        if cn != "as" then {
            # TATA: prepend 2x to China Unicom
            bgp_community.add((65002, 4837));
            # TATA: do not advertise to China Mobile
            bgp_community.add((65009, 58453));
        }
    }

    if node != "ber.ns2" && node != "yto.ns2" then {
        # Sparkle (Seabone): set localpref to 50 (backup route)
        bgp_community.add((6762, 1050));
    }

    if pool = "ns1" then {
        # Vultr: advertise to HE
        bgp_large_community.add((20473, 6099, 6939));
    }

    if cn = "na" && pop != "yto" then {
        if pool = "ns1" then {
            # Comcast: set localpref to 100 (below peers and transit)
            bgp_community.add((7922, 100));
        }
        if pool = "ns2" then {
            # Comcast: do not advertise to Bell
            bgp_community.add((65100, 577));
        }
        # Comcast: do not advertise to China Unicom
        bgp_community.add((65100, 4837));
        # Comcast: do not advertise to Orange
        bgp_community.add((65100, 5511));
        if pool = "ns1" then {
            # Comcast: do not advertise to TATA
            bgp_community.add((65100, 6453));
        }
    }

    if pool = "ns1" then {
        # Summit: set localpref to 50 (backup route)
        bgp_community.add((23352, 50));
    }

    if pool = "ns2" && pop != "ber" && pop != "yto" then {
        if cn != "eu" then {
            # Core-Backbone: do not advertise to Europe
            bgp_community.add((33891, 41000));
        }
        if cn != "na" then {
            # Core-Backbone: do not advertise to North America
            bgp_community.add((33891, 41010));
        }
        if cn != "as" then {
            # Core-Backbone: do not advertise to Asia
            bgp_community.add((33891, 41020));
            # Core-Backbone: do not advertise on PNI with Bharti
            bgp_community.add((33891, 2230));
            # Core-Backbone: do not advertise on PNI with Jio
            bgp_community.add((33891, 2650));
        }
        # Core-Backbone: do not advertise on IXP
        bgp_community.add((33891, 4000)); # N-IX
        bgp_community.add((33891, 5000)); # DE-CIX Frankfurt
        bgp_community.add((33891, 6000)); # LINX
        bgp_community.add((33891, 7000)); # AMS-IX
        bgp_community.add((33891, 8000)); # SwissIX
        bgp_community.add((33891, 9000)); # VIX
        bgp_community.add((33891, 10000)); # Peering.cz Prague
        bgp_community.add((33891, 11000)); # HOPUS Frankfurt
        bgp_community.add((33891, 12000)); # DE-CIX New York
        bgp_community.add((33891, 13000)); # NYIIX
        bgp_community.add((33891, 14000)); # MegaIX Dusseldorf
        bgp_community.add((33891, 15000)); # France-IX
        bgp_community.add((33891, 16000)); # Netnod
        bgp_community.add((33891, 17000)); # NIX.CZ
        bgp_community.add((33891, 18000)); # SAIX
        bgp_community.add((33891, 19000)); # Equinix Singapore
        bgp_community.add((33891, 20000)); # BCIX
        bgp_community.add((33891, 21000)); # Community-IX
        bgp_community.add((33891, 22000)); # DE-CIX Dusseldorf
        bgp_community.add((33891, 23000)); # DE-CIX Munich
        bgp_community.add((33891, 24000)); # DE-CIX Hamburg
        bgp_community.add((33891, 25000)); # DE-CIX Madrid
        bgp_community.add((33891, 26000)); # STIX Copenhagen
        bgp_community.add((33891, 27000)); # Espanix Madrid
        bgp_community.add((33891, 28000)); # Stuttgart-IX
        bgp_community.add((33891, 29000)); # MIX-IT
    }

    no_advertise(3204); # xTom V.PS
    no_advertise(3214); # xTom
    no_advertise(9002); # RETN
    no_advertise(20485); # TTK
    no_advertise(24013); # xTom DNS.SB
    no_advertise(26042); # FiberState
    no_advertise(26141); # CUBEPATH
    no_advertise(32098); # Flō Networks (Transtelco)
    no_advertise(57463); # NetIX

    if pool = "ns1" then {
        no_advertise(24724); # ATMAN
        no_advertise(28458); # IENTC Telecom
        no_advertise(41095); # IPTP Networks
    }

    if pool = "ns2" then {
        no_advertise(680); # DFN
        no_advertise(6939); # HE
        no_advertise(13030); # Init7
        no_advertise(19151); # 365 Data Centers
        no_advertise(57974); # Teracast
    }

    # SIX: do not advertise to peers connected in Kansas City or Minneapolis
    if pop = "sea" then {
        bgp_large_community.add((33108, 0, 835));
        bgp_large_community.add((33108, 0, 1002));
        bgp_large_community.add((33108, 0, 4150));
        bgp_large_community.add((33108, 0, 7201));
        bgp_large_community.add((33108, 0, 7488));
        bgp_large_community.add((33108, 0, 8674));
        bgp_large_community.add((33108, 0, 10242));
        bgp_large_community.add((33108, 0, 11708));
        bgp_large_community.add((33108, 0, 12186));
        bgp_large_community.add((33108, 0, 13737));
        bgp_large_community.add((33108, 0, 14371));
        bgp_large_community.add((33108, 0, 16909));
        bgp_large_community.add((33108, 0, 16970));
        bgp_large_community.add((33108, 0, 18451));
        bgp_large_community.add((33108, 0, 19418));
        bgp_large_community.add((33108, 0, 19969));
        bgp_large_community.add((33108, 0, 21709));
        bgp_large_community.add((33108, 0, 22295));
        bgp_large_community.add((33108, 0, 23428));
        bgp_large_community.add((33108, 0, 23459));
        bgp_large_community.add((33108, 0, 25615));
        bgp_large_community.add((33108, 0, 25944));
        bgp_large_community.add((33108, 0, 26156));
        bgp_large_community.add((33108, 0, 26329));
        bgp_large_community.add((33108, 0, 27523));
        bgp_large_community.add((33108, 0, 32030));
        bgp_large_community.add((33108, 0, 32097));
        bgp_large_community.add((33108, 0, 32621));
        bgp_large_community.add((33108, 0, 32943));
        bgp_large_community.add((33108, 0, 33362));
        bgp_large_community.add((33108, 0, 34553));
        bgp_large_community.add((33108, 0, 34927));
        bgp_large_community.add((33108, 0, 36236));
        bgp_large_community.add((33108, 0, 36374));
        bgp_large_community.add((33108, 0, 40138));
        bgp_large_community.add((33108, 0, 40350));
        bgp_large_community.add((33108, 0, 46416));
        bgp_large_community.add((33108, 0, 46733));
        bgp_large_community.add((33108, 0, 47689));
        bgp_large_community.add((33108, 0, 52025));
        bgp_large_community.add((33108, 0, 52210));
        bgp_large_community.add((33108, 0, 54309));
        bgp_large_community.add((33108, 0, 54566));
        bgp_large_community.add((33108, 0, 55216));
        bgp_large_community.add((33108, 0, 60326));
        bgp_large_community.add((33108, 0, 63066));
        bgp_large_community.add((33108, 0, 64227));
        bgp_large_community.add((33108, 0, 64289));
        bgp_large_community.add((33108, 0, 150289));
        bgp_large_community.add((33108, 0, 205329));
        bgp_large_community.add((33108, 0, 212483));
        bgp_large_community.add((33108, 0, 212895));
        bgp_large_community.add((33108, 0, 214329));
        bgp_large_community.add((33108, 0, 215248));
        bgp_large_community.add((33108, 0, 216440));
        bgp_large_community.add((33108, 0, 328112));
        bgp_large_community.add((33108, 0, 393577));
        bgp_large_community.add((33108, 0, 393950));
        bgp_large_community.add((33108, 0, 393968));
