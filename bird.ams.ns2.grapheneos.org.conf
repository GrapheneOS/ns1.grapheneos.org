define neighbor_ipv6 = 2a0b:4342:ffff::;

define node = "ams.ns2";
define pop = "ams";
define cn = "eu";
define cdn77 = true;
define misaka = true;

function no_advertise(int asn) {
    bgp_ext_community.add((rt, 65009, asn)); # Misaka.io
    bgp_large_community.add((24115, 0, asn)); # Equinix
    bgp_large_community.add((41441, 0, asn)); # Speed-IX
    bgp_large_community.add((50952, 0, asn)); # GNM-IX
    bgp_large_community.add((206221, 0, asn)); # ERA-IX

    if asn < 65536 then {
        # BBIX and LSIX
        bgp_community.add((0, asn));
    }
}

function local_filter() {
    # Equinix: advertise to all peers
    bgp_large_community.add((24115, 1, 24115));
    # Equinix: do not advertise to peers with RTT > 200ms
    bgp_large_community.add((24115, 2, 200));

    # CDN77: do not advertise to LSIX
    bgp_community.add((60068, 50070));

    # Misaka.io: do not advertise to GSL via Hyonix (Krixe)
    bgp_ext_community.add((rt, 65009, 931));
    # Misaka.io: remove Misaka from path to Krixe GSL transit
    #bgp_community.add((931, 47005));
}
