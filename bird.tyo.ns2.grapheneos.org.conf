function no_advertise(int asn) {
    bgp_ext_community.add((rt, 65009, asn)); # Misaka.io
    bgp_large_community.add((24115, 0, asn)); # Equinix

    # BBIX and JPNAP
    if asn < 65536 then {
        bgp_community.add((0, asn));
    }
}

function local_filter() {
    # Equinix: advertise to all peers
    bgp_large_community.add((24115, 1, 24115));
    # Equinix: do not advertise to peers with RTT > 200ms
    bgp_large_community.add((24115, 2, 200));

    # Misaka.io: do not advertise to GSL
    bgp_ext_community.add((rt, 65009, 137409));
}
