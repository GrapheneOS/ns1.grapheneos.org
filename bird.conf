include "bird.local.conf";
include "bird.pool.conf";

log syslog all;

router id public_ipv4;

protocol device {
    scan time 10;
}

filter grapheneos_filter {
    local_filter();

    if pool = "ns1" then {
        # Vultr: advertise to HE
        bgp_large_community.add((20473, 6099, 6939));
    }

    no_advertise(3204); # xTom V.PS
    no_advertise(3214); # xTom
    no_advertise(9002); # RETN
    no_advertise(20485); # TTK
    no_advertise(24013); # xTom DNS.SB
    no_advertise(26042); # FiberState
    no_advertise(26141); # CUBEPATH
    no_advertise(32098); # Flō Networks (Transtelco)
    no_advertise(57463); # NetIX

    if pool = "ns1" then {
        no_advertise(24724); # ATMAN
        no_advertise(28458); # IENTC Telecom
        no_advertise(41095); # IPTP Networks
    }

    if pool = "ns2" then {
        no_advertise(680); # DFN
        no_advertise(6939); # HE
        no_advertise(13030); # Init7
        no_advertise(19151); # 365 Data Centers
        no_advertise(57974); # Teracast
    }

    accept;
}

template bgp shared_bgp from pool_bgp {
    local as local_as;
    multihop 2;
    graceful restart on;
    hold time 60;
    connect delay time 0;
    connect retry time 5;
}

protocol bgp grapheneos_ipv4_bgp from shared_bgp {
    source address public_ipv4;
    neighbor neighbor_ipv4 as neighbor_as;
    ipv4 {
        import none;
        export filter grapheneos_filter;
    };
}

protocol bgp grapheneos_ipv6_bgp from shared_bgp {
    source address public_ipv6;
    neighbor neighbor_ipv6 as neighbor_as;
    ipv6 {
        import none;
        export filter grapheneos_filter;
    };
}
